name: CI

on:
  push:
    branches: [main, production-update]
  pull_request:
    branches: [main, production-update]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          FLASK_ENV: local
          CATEGORY_STORE_TYPE: local
          SESSION_SECRET_KEY: ci-session-secret-not-for-production
          FRONTEND_URL: http://localhost:3000
          MICROSOFT_CLIENT_ID: ci-client-id
          MICROSOFT_CLIENT_SECRET: ci-client-secret
          MICROSOFT_TENANT_ID: ci-tenant-id
          MICROSOFT_REDIRECT_URI: http://localhost:5001/callback
          OPENAI_API_KEY: sk-ci-placeholder
        run: python -m pytest -v --tb=short

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CI: true
          REACT_APP_API_BASE_URL: https://api.example.com
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 14

  terraform-validate:
    name: Terraform validate (local model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
