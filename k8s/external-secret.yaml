# External Secrets Operator — pulls from AWS Secrets Manager into a K8s Secret.
# Requires ESO installed on the cluster and IRSA on SA "external-secrets".
# DO NOT apply to a real cluster unless authorized.
#
# After terraform apply, set role ARN from: terraform output eso_irsa_role_arn
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: anatomy-feedback
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::423687459077:role/anatomy-feedback-api-eso-irsa
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: anatomy-feedback
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: anatomy-feedback-api-secrets
  namespace: anatomy-feedback
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: anatomy-feedback-api-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: anatomy-feedback/api
