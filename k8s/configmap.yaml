apiVersion: v1
kind: ConfigMap
metadata:
  name: anatomy-feedback-api
  namespace: anatomy-feedback
data:
  FLASK_ENV: "production"
  CATEGORY_STORE_TYPE: "s3"
  # Non-secret config only. Secrets belong in Secret / Secrets Manager / ExternalSecrets.
  AWS_REGION: "us-east-1"
  # FRONTEND_URL and CORS set per environment — example.com placeholders
  FRONTEND_URL: "https://app.example.com"
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
  # SKIP_AUTH must never be true in cluster
  SKIP_AUTH: "false"
