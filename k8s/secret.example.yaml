# EXAMPLE ONLY — manual K8s Secret fallback (not the preferred cloud path).
#
# Preferred production path:
#   AWS Secrets Manager (infra/secrets.tf)
#     → External Secrets Operator (k8s/external-secret.yaml)
#     → K8s Secret anatomy-feedback-api-secrets
#     → Deployment envFrom.secretRef (unchanged FastAPI os.getenv)
#
# Manual create (local kind/minikube only):
#   kubectl create secret generic anatomy-feedback-api-secrets \
#     --namespace anatomy-feedback \
#     --from-literal=SESSION_SECRET_KEY=... \
#     --from-literal=MICROSOFT_CLIENT_SECRET=... \
#     --from-literal=OPENAI_API_KEY=...
#
apiVersion: v1
kind: Secret
metadata:
  name: anatomy-feedback-api-secrets
  namespace: anatomy-feedback
type: Opaque
stringData:
  SESSION_SECRET_KEY: "REPLACE_ME"
  MICROSOFT_CLIENT_ID: "REPLACE_ME"
  MICROSOFT_CLIENT_SECRET: "REPLACE_ME"
  MICROSOFT_TENANT_ID: "REPLACE_ME"
  MICROSOFT_REDIRECT_URI: "https://api.example.com/callback"
  OPENAI_API_KEY: "REPLACE_ME"
  CATEGORY_BUCKET_NAME: "anatomy-feedback-categories-PLACEHOLDER"
