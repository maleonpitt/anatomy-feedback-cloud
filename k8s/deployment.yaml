apiVersion: apps/v1
kind: Deployment
metadata:
  name: anatomy-feedback-api
  namespace: anatomy-feedback
  labels:
    app: anatomy-feedback-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anatomy-feedback-api
  template:
    metadata:
      labels:
        app: anatomy-feedback-api
    spec:
      serviceAccountName: anatomy-feedback-api
      containers:
        - name: api
          # Placeholder ECR image — CD replaces :latest with git SHA after ECR push
          image: 423687459077.dkr.ecr.us-east-1.amazonaws.com/anatomy-feedback-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: anatomy-feedback-api
            - secretRef:
                name: anatomy-feedback-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
