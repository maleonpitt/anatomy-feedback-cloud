# ============================================
# Redirect HTTP → HTTPS
# ============================================
server {
    listen 80;
    server_name app.heilab.pitt.edu;
    return 301 https://$host$request_uri;
}

# ============================================
# HTTPS Server
# ============================================
server {
    listen 443 ssl http2;
    server_name app.heilab.pitt.edu;

    # ============================================
    # SSL Certificates
    # ============================================
    ssl_certificate /etc/letsencrypt/live/app.heilab.pitt.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.heilab.pitt.edu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ============================================
    # Security Headers
    # ============================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================
    # CSP (React + Azure Auth)
    # ============================================
    add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com https://app.heilab.pitt.edu; frame-src https://login.microsoftonline.com;" always;

    # ============================================
    # Serve React build
    # ============================================
    root /usr/share/nginx/html;
    index index.html;

    # Global cookie configuration
    proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";

    # ============================================
    # React Router
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        access_log off;
    }

    # ============================================
    # Proxy: /login → Flask
    # ============================================
    location /login {
        proxy_pass http://feedback-backend:5000/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookies
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Domain consistency
        proxy_cookie_domain feedback-backend .app.heilab.pitt.edu;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
    }

    # ============================================
    # Proxy: /callback → Flask (Azure redirect)
    # ============================================
    location /callback {
        proxy_pass http://feedback-backend:5000/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookies
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Domain consistency
        proxy_cookie_domain feedback-backend .app.heilab.pitt.edu;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";

        # Fix redirect Flask → React
        proxy_redirect http://feedback-backend:5000 https://app.heilab.pitt.edu;
    }

    # ============================================
    # Proxy: /api/* → Flask API
    # ============================================
    location /api/ {
        proxy_pass http://feedback-backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookies
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Domain consistency
        proxy_cookie_domain feedback-backend .app.heilab.pitt.edu;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=None";
    }

    # ============================================
    # Health check
    # ============================================
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Fallback for React Router
    error_page 404 /index.html;
}
