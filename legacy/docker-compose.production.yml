version: "3.9"

# LEGACY — historical production layout on app.heilab.pitt.edu (Nginx + backend).
# NOT part of the Phase 7 target architecture. Retained for reference only.
# See legacy/README.md and docs/PHASE_7_CLOUDFRONT.md

services:
  backend:
    image: feedback-feedback-backend:latest
    container_name: feedback-backend
    restart: unless-stopped
    env_file:
      - /home/ubuntu/feedback/.env.production
    expose:
      - "5000"
    volumes:
      - /home/ubuntu/feedback/sessions:/app/sessions
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: ..
      dockerfile: legacy/nginx/Dockerfile
    container_name: feedback-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - /home/ubuntu/feedback/.env.production
    volumes:
      - /home/ubuntu/feedback/frontend/build:/usr/share/nginx/html:ro
      - /home/ubuntu/feedback/legacy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/app.heilab.pitt.edu:/etc/letsencrypt/live/app.heilab.pitt.edu:ro
      - /etc/letsencrypt/archive/app.heilab.pitt.edu:/etc/letsencrypt/archive/app.heilab.pitt.edu:ro
      - /etc/letsencrypt/options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf:ro
      - /etc/letsencrypt/ssl-dhparams.pem:/etc/letsencrypt/ssl-dhparams.pem:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "https://app.heilab.pitt.edu/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
    attachable: true
